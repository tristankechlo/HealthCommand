name: Build and Publish Release

on:
  release:
    types: [ published ]

env:
  MODID: "healthcommand"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      java-version: ${{ steps.properties.outputs.java_version }}
      mc-version: ${{ steps.properties.outputs.minecraft_version }}
      mod-version: ${{ steps.properties.outputs.mod_version }}
      version-range: ${{ steps.properties.outputs.version_range }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@v6

      - name: calculate versions
        id: properties
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: "gradle.properties"
          properties: "minecraft_version mod_version version_range java_version"

      - name: Changelog
        shell: bash
        run: |
          echo "# Changelog ${{ steps.properties.outputs.minecraft_version }} - ${{ steps.properties.outputs.mod_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ github.event.release.body }}" >> $GITHUB_STEP_SUMMARY

  build-and-release:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: ${{ needs.prepare.outputs.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Execute Gradle build
        run: ./gradlew build

      - name: Add files to GitHub-Release
        uses: shogo82148/actions-upload-release-asset@v1.10.6
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./build/libs/${{ env.MODID }}-*.jar
          overwrite: true

      - name: publish mod files
        uses: tristankechlo/publish-mc-mod@v2.0.0
        if: ${{ !contains(github.event.release.name, '[NOCI]') }}
        with:
          mc-version: ${{ needs.prepare.outputs.mc-version }}
          mod-version: ${{ needs.prepare.outputs.mod-version }}
          curseforge-id: 509942
          modrinth-id: "TAfJ7PBS"
          changelog: ${{ github.event.release.body }}
          loaders: forge
          version-range: ${{ needs.prepare.outputs.version-range }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

  send-discord-embed:
    needs: [ "prepare", "build-and-release" ]
    runs-on: ubuntu-latest
    steps:
      - name: Make embed
        uses: tristankechlo/create-discord-embed@v1.1.2
        with:
          released: ${{ !contains(github.event.release.name, '[NOCI]') }}
          changelog: "${{ github.event.release.body }}"
          version: "${{ needs.prepare.outputs.mc-version }} - ${{ needs.prepare.outputs.mod-version }}"
          color: 16101646
          mod-name: "Health Command"
          mention: "<@&890143510316068905>"
          loaders: Forge
          curseforge: "https://www.curseforge.com/minecraft/mc-mods/health-command"
          modrinth: "https://modrinth.com/mod/health-command"
          github: ${{ github.event.release.html_url }}
          thumbnail: "https://cdn.modrinth.com/data/TAfJ7PBS/icon.png"

      - name: Send Discord Message
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          raw-data: ./embed.json
