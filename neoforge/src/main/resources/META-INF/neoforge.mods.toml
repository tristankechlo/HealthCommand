modLoader="javafml"
loaderVersion="${neoforge_loader_range}"
license="CC BY-NC-ND 4.0"
showAsResourcePack=false
issueTrackerURL="https://github.com/tristankechlo/HealthCommand/issues"

[[mods]]
    modId="healthcommand"
    version="${version}"
    displayName="Health Command"
    displayURL="https://www.curseforge.com/minecraft/mc-mods/health-command"
    #logoFile="examplemod.png"
    #credits="Thanks for this example mod goes to Java"
    authors="Buecher_wurm"
    description='''adds a simple /health command'''

[[dependencies.healthcommand]]
    modId="neoforge"
    type="required"
    versionRange = "${neoforge_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.healthcommand]]
    modId="minecraft"
    type="required"
    versionRange="${version_range}"
    ordering="NONE"
    side="BOTH"